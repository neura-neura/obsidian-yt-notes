<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian YT Notes</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="shadcn.css" />
    <link rel="stylesheet" href="vendor/toastui/toastui-editor.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <div class="brand">Obsidian YT Notes</div>
          <div id="contextLabel" class="muted">Loading page context...</div>
        </div>
        <div class="top-actions">
          <div class="ui-dropdown theme-menu">
            <button
              type="button"
              class="ui-button ui-button-outline ui-button-icon theme-toggle"
              title="Theme"
              aria-haspopup="menu"
              aria-expanded="false"
              data-theme-toggle
            >
              <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
              <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20.99 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 20.99 12.79z" />
              </svg>
              <span class="sr-only">Toggle theme</span>
            </button>
            <div class="ui-dropdown-content" role="menu" aria-label="Theme">
              <button type="button" class="ui-dropdown-item" role="menuitemradio" data-theme-value="light">Light</button>
              <button type="button" class="ui-dropdown-item" role="menuitemradio" data-theme-value="dark">Dark</button>
              <button type="button" class="ui-dropdown-item" role="menuitemradio" data-theme-value="system">System</button>
            </div>
          </div>
          <button id="toggleCompact" class="ui-button ui-button-outline ui-button-icon icon-btn" title="Compact editor" aria-label="Compact editor" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 3H5a2 2 0 0 0-2 2v3" />
              <path d="M16 3h3a2 2 0 0 1 2 2v3" />
              <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
              <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
              <path d="M9 9h6v6H9z" />
            </svg>
          </button>
          <button id="toggleDockMode" class="ui-button ui-button-outline ui-button-icon icon-btn" title="Open floating notes panel" aria-label="Open floating notes panel" aria-pressed="false" type="button">
            <svg class="dock-panel-icon" aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M15 4v16" />
              <path d="M7 8h4" />
              <path d="M7 12h4" />
            </svg>
            <svg class="floating-panel-icon" aria-hidden="true" viewBox="0 0 24 24">
              <rect x="4" y="5" width="16" height="14" rx="2" />
              <path d="M8 9h5" />
              <path d="M8 13h8" />
              <path d="M15 3h6v6" />
              <path d="m21 3-7 7" />
            </svg>
          </button>
          <button id="refreshNotes" class="ui-button ui-button-outline ui-button-icon icon-btn" title="Refresh notes" aria-label="Refresh notes" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 12a9 9 0 0 1-9 9 8.8 8.8 0 0 1-6.3-2.6" />
              <path d="M3 12a9 9 0 0 1 9-9 8.8 8.8 0 0 1 6.3 2.6" />
              <path d="M18 2v4h-4" />
              <path d="M6 22v-4h4" />
            </svg>
          </button>
          <button id="closePanel" class="ui-button ui-button-outline ui-button-icon icon-btn" title="Close panel" aria-label="Close panel" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </header>

      <section id="vaultBanner" class="vault-banner">
        <div>
          <strong id="vaultStatus">Notes folder not connected</strong>
          <span id="folderStatus">Select the folder where video notes should be saved.</span>
        </div>
        <button id="connectVault" class="ui-button ui-button-primary primary" type="button">Select folder</button>
      </section>

      <main class="workspace">
        <aside class="note-list">
          <div class="list-header">
            <span id="notesListTitle">Notes for this video</span>
            <button id="newNote" class="ui-button ui-button-outline ui-button-icon icon-btn new-note-btn" title="New note" aria-label="New note" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <path d="M14 2v6h6" />
                <path d="M12 18v-6" />
                <path d="M9 15h6" />
              </svg>
            </button>
          </div>
          <div id="notesList" class="notes"></div>
        </aside>

        <section class="editor-pane">
          <div class="editor-toolbar">
            <label for="noteTitle" class="title-label">Title</label>
            <input
              id="noteTitle"
              class="ui-input"
              type="text"
              placeholder="Note title"
              title="Note title saved in the frontmatter. The file path is shown in the footer."
            />
            <label for="noteSource" class="title-label">Source</label>
            <input
              id="noteSource"
              class="ui-input"
              type="url"
              placeholder="Video source URL"
              title="Video source saved in the frontmatter."
            />
          </div>
          <div class="markdown-surface">
            <div id="noteEditor" aria-label="Markdown editor"></div>
            <textarea id="noteBody" hidden></textarea>
          </div>
          <footer class="statusbar">
            <span id="saveStatus">Ready</span>
            <span class="document-stats">
              <span id="wordCount">0 words</span>
              <span id="charCount">0 chars</span>
            </span>
            <span id="activeFile"></span>
          </footer>
        </section>
      </main>
    </div>

    <script src="vendor/toastui/toastui-editor.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
